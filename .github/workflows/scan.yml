name: WordPress WPScan - Remediated

on:
  push:
    branches:
      - main

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker environment
        run: |
          sudo systemctl start docker
          docker version

      - name: Start Hardened WordPress Stack
        run: |
          cd docker
          docker-compose up -d --build

      - name: Wait for WordPress to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/wp-content/ | grep -q "<title>"; then
              break
            fi
            sleep 5
          done

      - name: Install Ruby and WPScan
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev
          sudo gem install wpscan

      - name: Run WPScan (JSON format)
        run: |
          wpscan --url http://localhost:8080 --enumerate u,vp,vt --format json -o scans/wpscan-remediated-report.json --force || true

      - name: Upload Remediated WPScan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-remediated-results
          path: scans/wpscan-remediated-report.json